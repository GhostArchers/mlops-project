stages:
  preprocess:
    cmd: python src/data_processing.py
    deps:
      - src/data_processing.py
      - data/data.csv
      - params.yaml
    outs:
      - data/X_train.csv
      - data/X_test.csv
      - data/y_train.csv
      - data/y_test.csv
      - models/scaler.pkl
      - models/selector.pkl

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/X_train.csv
      - data/y_train.csv
      - params.yaml
    outs:
      - models/model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pkl
      - data/X_test.csv
      - data/y_test.csv